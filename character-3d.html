<header>

  const BW = 667, BH = 715;
  const W = 1200, H = 1200, SCALE = 1010 / Math.max(BW, BH);
  const statusEl = document.getElementById('status');

  function hexToRgb(h) {
    h = h.trim().replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function token(name) {
    return hexToRgb(getComputedStyle(document.documentElement).getPropertyValue('--' + name));
  }

  // ---------- CPU: masks, signed distance, inflated height ----------
  function drawMasks() {
    const tx = (W - BW * SCALE) / 2, ty = (H - BH * SCALE) / 2;

    const body = document.createElement('canvas');
    body.width = W; body.height = H;
    const bctx = body.getContext('2d', { willReadFrequently: true });
    bctx.fillStyle = 'rgb(0,0,0)'; bctx.fillRect(0, 0, W, H);
    bctx.setTransform(SCALE, 0, 0, SCALE, tx, ty);
    bctx.fillStyle = 'rgb(255,255,255)';
    bctx.fill(new Path2D(BODY), 'evenodd');
    const bd = bctx.getImageData(0, 0, W, H).data;
    const m = new Float32Array(W * H);
    for (let i = 0; i < m.length; i++) m[i] = bd[i * 4] / 255;

    return { m, tx, ty };
  }

  // face = closed-eye arcs + smile, placed from the reference (arcs go to G, smile to B)
  function renderFeat(tx, ty) {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = 'rgb(0,0,0)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.setTransform(SCALE, 0, 0, SCALE, tx, ty);
    ctx.lineCap = 'round';

    const bowl = (cx, cy, rx, ry, lw, color) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0.06 * Math.PI, 0.94 * Math.PI);
      ctx.stroke();
    };
    for (const e of FACE.eyes) {
      const w = e.x1 - e.x0, h = e.y1 - e.y0;
      const rx = w * 0.40, ry = rx * 0.85;
      const bottom = e.y0 + h * 0.66;
      bowl((e.x0 + e.x1) / 2, bottom - ry, rx, ry, w * 0.16, 'rgb(0,255,0)');
    }
    const m = FACE.mouth, mw = m.x1 - m.x0, mh = m.y1 - m.y0;
    const mrx = mw * 0.40, mry = mrx * 0.80;
    bowl((m.x0 + m.x1) / 2, m.y0 + mh * 0.97 - mry, mrx, mry, mw * 0.21, 'rgb(0,0,255)');

    const id = ctx.getImageData(0, 0, W, H).data;
    const out = new Uint8Array(W * H * 4);
    for (let c = 0; c < 3; c++) {
      const ch = new Float32Array(W * H);
      for (let i = 0; i < ch.length; i++) ch[i] = id[i * 4 + c] / 255;
      const bl = boxBlur(ch, 3, 2);
      for (let i = 0; i < bl.length; i++) out[i * 4 + c] = Math.round(bl[i] * 255);
    }
    for (let i = 0; i < W * H; i++) out[i * 4 + 3] = 255;
    return out;
  }

  function boxBlur(src, r, passes) {
    let a = Float32Array.from(src), b = new Float32Array(src.length);
    const cl = (v, hi) => (v < 0 ? 0 : v > hi ? hi : v);
    const inv = 1 / (2 * r + 1);
    for (let p = 0; p < passes; p++) {
      for (let y = 0; y < H; y++) {
        const row = y * W; let sum = 0;
        for (let x = -r; x <= r; x++) sum += a[row + cl(x, W - 1)];
        for (let x = 0; x < W; x++) {
          b[row + x] = sum * inv;
          sum += a[row + cl(x + r + 1, W - 1)] - a[row + cl(x - r, W - 1)];
        }
      }
      for (let x = 0; x < W; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) sum += b[cl(y, H - 1) * W + x];
        for (let y = 0; y < H; y++) {
          a[y * W + x] = sum * inv;
          sum += b[cl(y + r + 1, H - 1) * W + x] - b[cl(y - r, H - 1) * W + x];
        }
      }
    }
    return a;
  }

  function edt1d(f, n, d, v, z) {
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }

  // distance (px) from every pixel to the nearest pixel where sites[i] === 1
  function distanceTo(sites) {
    const INF = 1e20;
    const f = new Float32Array(W * H);
    for (let i = 0; i < f.length; i++) f[i] = sites[i] ? 0 : INF;
    const n = Math.max(W, H);
    const v = new Int32Array(n), z = new Float32Array(n + 1), d = new Float32Array(n), col = new Float32Array(n);
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) col[y] = f[y * W + x];
      edt1d(col, H, d, v, z);
      for (let y = 0; y < H; y++) f[y * W + x] = d[y];
    }
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) col[x] = f[row + x];
      edt1d(col, W, d, v, z);
      for (let x = 0; x < W; x++) f[row + x] = Math.sqrt(d[x]);
    }
    return f;
  }

  function buildBodyTexture(m) {
    // round the cusps between petals a little — stuffed plush can't hold a razor-sharp notch
    const sm = boxBlur(m, 9, 3);
    const inside = new Uint8Array(W * H), outside = new Uint8Array(W * H);
    let cx = 0, cy = 0, cnt = 0;
    for (let i = 0; i < inside.length; i++) {
      if (sm[i] > 0.5) {
        inside[i] = 1;
        cx += i % W; cy += (i / W) | 0; cnt++;
      } else outside[i] = 1;
    }
    cx /= cnt; cy /= cnt;
    const dIn = distanceTo(outside);   // inside pixels: distance to the rim
    const dOut = distanceTo(inside);   // outside pixels: distance to the body

    const PROFILE_R = 175, PUFF = 190;
    const raw = new Float32Array(W * H);
    for (let i = 0; i < raw.length; i++) {
      if (inside[i]) {
        const t = Math.min(dIn[i] / PROFILE_R, 1);
        raw[i] = PUFF * Math.sqrt(1 - (1 - t) * (1 - t));
      }
    }
    const height = boxBlur(raw, 24, 3);
    const heightBig = boxBlur(raw, 60, 3);

    const sdRaw = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) sdRaw[i] = inside[i] ? dIn[i] - 0.5 : -(dOut[i] - 0.5);
    const sdSmooth = boxBlur(sdRaw, 3, 2);   // removes pixel stair-steps along the contour
    const data = new Float32Array(W * H * 4);
    for (let i = 0; i < W * H; i++) {
      data[i * 4] = height[i];
      data[i * 4 + 1] = sdSmooth[i];
      data[i * 4 + 2] = heightBig[i];
      data[i * 4 + 3] = 1;
    }
    return { data, cx, cy };
  }

  const VS = `#version 300 es
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));

  const FS = `#version 300 es

  const float TILE = 512.0;

  vec2 rot67(vec2 p) { return vec2(0.3907 * p.x - 0.9205 * p.y, 0.9205 * p.x + 0.3907 * p.y); }
  vec2 rot31(vec2 p) { return vec2(0.8572 * p.x - 0.5150 * p.y, 0.5150 * p.x + 0.8572 * p.y); }

  // two rotated copies of the strand tile, merged like overlapping hair layers
  float hairCover(vec2 p) {
    float h1 = texture(uFur, p / TILE).r;
    float h2 = texture(uFur, rot31(p) / TILE + vec2(0.37, 0.61)).r;
    float h3 = texture(uFur, rot67(p) / TILE + vec2(0.71, 0.19)).r;
    return 1.0 - (1.0 - h1) * (1.0 - 0.85 * h2) * (1.0 - 0.7 * h3);
  }
  float undercoat(vec2 p) { return texture(uFur, p / TILE + vec2(0.13, 0.29)).g; }

  float depthAt(ivec2 p) {
    vec4 f = texelFetch(uFeat, p, 0);
    return 0.40 * f.r + 0.95 * f.g + f.b;
  }

  // wide, gentle shadow of one lobe on another, marched toward the light over the height field
  float softShadow(ivec2 ip, float h0, vec3 L) {
    vec2 ld = normalize(L.xy + 1e-5);
    float slope = L.z / max(length(L.xy), 1e-3);
    ivec2 hi = ivec2(uSize) - 1;
    float occ = 0.0;
    for (int i = 1; i <= 28; i++) {
      float d = 5.0 * pow(float(i), 1.18);
      ivec2 p = clamp(ip + ivec2(round(ld * d)), ivec2(0), hi);
      float ht = texelFetch(uBody, p, 0).r;
      occ = max(occ, smoothstep(0.0, 60.0, ht - (h0 + slope * d * 0.9)));
    }
    return occ;
  }

  void main() {
    ivec2 ip = ivec2(int(gl_FragCoord.x), int(uSize.y - 1.0 - gl_FragCoord.y));
    vec2 pix = vec2(ip) + 0.5;
    vec4 B = texelFetch(uBody, ip, 0);
    float sd = B.g;

    float H = hairCover(pix);
    float U = undercoat(pix);

    // inflated form -> normal
    float hx = (texelFetch(uBody, ip + ivec2(2, 0), 0).r - texelFetch(uBody, ip - ivec2(2, 0), 0).r) * 0.25;
    float hy = (texelFetch(uBody, ip + ivec2(0, 2), 0).r - texelFetch(uBody, ip - ivec2(0, 2), 0).r) * 0.25;
    vec3 n0 = normalize(vec3(-hx * 1.9, -hy * 1.9, 1.0));

    vec4 ft = texelFetch(uFeat, ip, 0);
    float D = 0.40 * ft.r + 0.95 * ft.g + ft.b;
    float Dx = (depthAt(ip + ivec2(2, 0)) - depthAt(ip - ivec2(2, 0))) * 0.25;
    float Dy = (depthAt(ip + ivec2(0, 2)) - depthAt(ip - ivec2(0, 2))) * 0.25;
    float Dsm = clamp(D * 1.4, 0.0, 1.0);
    // pressed-in features: lowered height field, so the wall facing the light goes dark
    vec3 n = normalize(n0 + vec3(Dx, Dy, 0.0) * 13.0);

    vec3 L = normalize(uL);
    float t0 = dot(n0, L);
    float t = dot(n, L);

    // narrow tonal range: lit pile is lighter and less saturated, shade is richer
    vec3 col = mix(cLo, cBase, smoothstep(-0.65, 0.30, t));
    col = mix(col, cHi, smoothstep(0.30, 1.0, t) * 0.92);

    // lobes shade each other softly; creases are a touch darker
    float occ = softShadow(ip, B.r, L) * smoothstep(-6.0, 14.0, sd);
    col = mix(col, cLo * 0.92, 0.38 * occ);
    float cav = clamp((B.b - B.r) / 34.0, 0.0, 1.0) * smoothstep(10.0, 55.0, sd);
    col *= 1.0 - 0.20 * cav;

    // ---- hair: thin light curved strands lying over a darker, softly mottled undercoat ----
    float inFur = (1.0 - 0.85 * Dsm) * (0.30 + 0.70 * smoothstep(0.0, 34.0, sd));
    vec3 under = col * (0.955 + 0.06 * (U - 0.5));
    float glint = mix(0.10, 0.24, smoothstep(0.0, 0.9, t));          // strands on the lit side catch more light
    vec3 hairCol = mix(col, cRim, glint) * 1.03;
    col = mix(under, hairCol, clamp(H * 1.3, 0.0, 1.0) * uFurAmp * inFur);
    col = mix(col, under, (1.0 - inFur));

    // soft backlit sheen on the lit rim
    vec2 nxy = normalize(n0.xy + 1e-4);
    float litSide = clamp(dot(nxy, normalize(L.xy + 1e-4)) * 0.5 + 0.5, 0.0, 1.0);
    float rim = 1.0 - smoothstep(0.0, 28.0, sd);
    col = mix(col, cRim, clamp(rim * 0.20 * litSide + pow(1.0 - clamp(n0.z, 0.0, 1.0), 2.0) * 0.10, 0.0, 0.32));

    // neat silhouette: one continuous, softly blurred contour with only a smooth wobble
    float x = sd + (U - 0.5) * 1.6;
    float core = smoothstep(-6.0, 3.5, x);
    float tail = smoothstep(-14.0, -1.0, x) * 0.10;
    float a = max(core, tail);

    // ---- face: grooves cut through the pile, as on the reference ----
    // the opening shows a smooth, flat, deep base tone (no hair inside); the pile curls over its rim
    float nz = (H - 0.35) * 0.10;                                      // a whisper of hair in the opening's edge
    float dd = clamp(0.95 * ft.g + ft.b, 0.0, 1.0);
    float ddN = smoothstep(0.26, 0.66, dd + nz);                       // soft, smooth transition into the opening
    vec3 furCol = col;
    vec3 groove = cDeep * (0.74 + 0.36 * smoothstep(-0.9, 0.5, t));   // shaded walls, flat deep floor
    col = mix(furCol, groove, ddN);

    // soft light lip of pile all around the opening
    float lip = smoothstep(0.02, 0.34, D) * (1.0 - smoothstep(0.34, 0.70, D));
    col = mix(col, cRim, 0.24 * lip * (0.5 + 0.8 * H));

    // wide, very soft glow of lighter pile around the opening (averaged over a larger ring)
    float halo = 0.0;
    for (int k = 0; k < 8; k++) {
      float ang = float(k) * 0.7853982;
      halo += depthAt(ip + ivec2(int(round(cos(ang) * 14.0)), int(round(sin(ang) * 14.0))));
    }
    halo *= 0.125;
    col = mix(col, cRim, clamp(halo * 0.9, 0.0, 0.30) * (1.0 - ddN));

    // fur pressed down around the grooves
    float ring = 0.0;
    for (int k = 0; k < 8; k++) {
      float ang = float(k) * 0.7853982;
      ring = max(ring, depthAt(ip + ivec2(int(round(cos(ang) * 8.0)), int(round(sin(ang) * 8.0)))));
    }
    col *= 1.0 - 0.08 * clamp(ring, 0.0, 1.0) * (1.0 - Dsm);

    outColor = vec4(mix(cBg, clamp(col, 0.0, 1.0), a), 1.0);
  }`;

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('shader compile failed');
    }
    return s;
  }

  function init(furImg) {
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) { statusEl.textContent = 'Потрібен WebGL2.'; return; }

    const { m, tx, ty } = drawMasks();
    const body = buildBodyTexture(m);

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); throw new Error('link failed'); }
    gl.useProgram(prog);
    gl.bindVertexArray(gl.createVertexArray());

    function tex(unit) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }
    tex(0);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, body.data);
    tex(1);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, renderFeat(tx, ty));

    const furTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, furTex);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, furImg);
    gl.generateMipmap(gl.TEXTURE_2D);

    const U = (n) => gl.getUniformLocation(prog, n);
    gl.uniform1i(U('uFur'), 2);
    gl.uniform1f(U('uFurAmp'), 1.0);
    gl.uniform1i(U('uBody'), 0);
    gl.uniform1i(U('uFeat'), 1);
    gl.uniform2f(U('uSize'), W, H);
    gl.uniform2f(U('uCenter'), body.cx, body.cy);
    gl.uniform3fv(U('cBg'), token('white'));
    gl.uniform3fv(U('cDeep'), token('primary-800'));
    gl.uniform3fv(U('cLo'), token('primary-600'));
    gl.uniform3fv(U('cBase'), token('primary-500'));
    gl.uniform3fv(U('cHi'), token('primary-400'));
    gl.uniform3fv(U('cRim'), token('primary-300'));
    gl.uniform3fv(U('cWhite'), token('white'));
    gl.uniform3fv(U('cBlack'), token('black'));
    gl.viewport(0, 0, W, H);

    let L = [-0.5, -0.55, 0.65];
    let pending = false;
    function draw() {
      pending = false;
      gl.uniform3fv(U('uL'), L);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function schedule() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
    draw();

    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      const nx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      const ny = ((e.clientY - r.top) / r.height - 0.5) * 2;
      L = [nx * 0.9, ny * 0.9, 0.6];
      schedule();
    });

    const save = document.getElementById('save');
    save.hidden = false;
    save.addEventListener('click', () => {
      draw();
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'nagadayka-flower-3d.png';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
    statusEl.textContent = '';
  }

  const furImg = new Image();
  furImg.onload = () => requestAnimationFrame(() => setTimeout(() => init(furImg), 30));
  furImg.src = FUR_DATA;
})();
</script>
</body>
</html>
